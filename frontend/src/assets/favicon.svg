<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Outer Dark/Gradient Background Badge -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="#090d16" />
  <rect x="4" y="4" width="56" height="56" rx="15" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
  
  <!-- HR Monogram Badge -->
  <text x="32" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', 'Plus Jakarta Sans', sans-serif" font-size="27" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="1">HR</text>
  
  <!-- Pulsing Green Indicator Dot -->
  <circle cx="50" cy="14" r="4.5" fill="#10b981" stroke="#090d16" stroke-width="2" />
</svg>
